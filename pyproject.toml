[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-payment-fraud-detection"
version = "0.1.0"
description = "Leakage-safe graph features for payment-fraud investigator prioritization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "networkx>=3.3,<4",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "shap>=0.47,<1",
    "streamlit>=1.45,<2",
    "plotly>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
