[project]
name = "graph-payment-fraud-detection"
seed = 42

[data]
raw_dir = "data/raw/ieee-cis"
processed_file = "data/processed/transactions.csv"
synthetic_rows = 500

[validation]
train_fraction = 0.60
validation_fraction = 0.20
purge_seconds = 86400

[rules]
high_amount_quantile = 0.95
very_high_amount_quantile = 0.99

[model]
l2_strength = 0.10
max_iterations = 5000
tolerance = 1e-7
random_seed = 42

[evaluation]
investigation_capacity_fraction = 0.05
