[project]
name = "graph-payment-fraud-detection"
seed = 42

[data]
raw_dir = "data/raw/ieee-cis"
processed_file = "data/processed/transactions.csv"
synthetic_rows = 500

[validation]
train_fraction = 0.60
validation_fraction = 0.20
purge_seconds = 86400

[rules]
high_amount_quantile = 0.95
very_high_amount_quantile = 0.99

[model]
l2_strength = 0.10
max_iterations = 5000
tolerance = 1e-7
random_seed = 42

[explainability]
selected_model = "tabular_graph_lightgbm"
max_reasons = 3

[evaluation]
investigation_capacity_fraction = 0.05

[graph]
include_purge_rows_in_unlabelled_history = true
pagerank_refresh_batches = 25
pagerank_alpha = 0.85
label_maturity_seconds = 86400

[boosted_model]
n_estimators = 400
learning_rate = 0.03
num_leaves = 15
max_depth = 5
min_child_samples = 15
subsample = 1.0
colsample_bytree = 0.9
reg_lambda = 1.0
early_stopping_rounds = 40
random_seed = 42
